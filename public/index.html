<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papan skor</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/display.css" />
  </head>
  <body>
    <main class="stage">
      <header class="head">
        <div>
          <h1 id="title">Papan skor</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
        <div id="game" class="game" hidden>
          <span class="game-label">Game berjalan</span>
          <span id="game-name" class="game-name"></span>
          <span id="game-role" class="game-role" hidden></span>
        </div>
      </header>

      <section class="board-wrap">
        <ol id="board" class="board" hidden></ol>
        <div id="message" class="message">
          <h2>Menyambung ke server</h2>
          <p></p>
        </div>
      </section>

      <p id="status" class="status" role="status" hidden>Koneksi terputus. Menyambung ulang…</p>
    </main>
    <script type="module" src="/js/display.js"></script>
  </body>
</html>
